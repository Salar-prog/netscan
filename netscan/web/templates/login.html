<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NetScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 mb-4">
                <i data-lucide="radar" class="w-7 h-7 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">NetScan</h1>
            <p class="text-slate-400 text-sm mt-1">Sign in with your API key</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="api_key" class="block text-sm font-medium text-slate-300 mb-1.5">API Key</label>
                <input
                    type="password"
                    id="api_key"
                    name="api_key"
                    required
                    autofocus
                    placeholder="ns_live_..."
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
                />
            </div>
            <button
                type="submit"
                class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition"
            >
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">
            Don't have a key? Ask your admin to create one via the API.
        </p>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
