[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.1.0"
description = "Production-grade IP discovery and availability tracking platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "Salar-prog" }]
requires-python = ">=3.10"
keywords = ["network", "scanner", "ipam", "ip-address-management", "nmap", "fastapi", "htmx", "subnet", "discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "alembic>=1.13.0",
    "click>=8.5.0",
]

[project.scripts]
netscan = "netscan.cli:main"

[project.urls]
Homepage = "https://github.com/Salar-prog/netscan"
Repository = "https://github.com/Salar-prog/netscan"
Issues = "https://github.com/Salar-prog/netscan/issues"
Changelog = "https://github.com/Salar-prog/netscan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ldap = [
    "python-ldap>=3.4.0",
]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
