name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - run: pip install -e ".[test,ldap]"
      - run: pytest -v

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netscan
          POSTGRES_PASSWORD: netscan_test
          POSTGRES_DB: netscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - run: pip install -e ".[test,ldap]"
      - run: pip install psycopg2-binary
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://netscan:netscan_test@localhost:5432/netscan_test
      - run: pytest -v -k "not test_bootstrap_first_key"
        env:
          DATABASE_URL: postgresql://netscan:netscan_test@localhost:5432/netscan_test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check netscan/
      - run: ruff format --check netscan/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t netscan:test .
      - run: docker run -d --name netscan -p 8000:8000 -e SECRET_KEY=test-key netscan:test
      - run: sleep 5 && curl -sf http://localhost:8000/health || (docker logs netscan && exit 1)
